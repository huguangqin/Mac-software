# Rime 自定义补丁
# 作用：在方案列表中挂载「五笔拼音混输」方案
# 部署方式：鼠须管菜单 → 重新部署（Ctrl + Option + ~）

patch:
  # Caps Lock 作为大写锁定键：灯亮时字母直出大写、不弹候选
  # 关键：good_old_caps_lock 只有 Caps_Lock != noop 时才生效！
  # noop 会让 Rime 完全不感知 Caps，导致大写状态仍走拼音编码弹候选
  # commit_code：按 Caps 后提交当前编码 + 切西文模式 + 开启大写锁定（灯亮）
  # 前提：系统层面已关闭「用 Caps 切换 ABC 输入法」（系统设置→键盘→输入法→编辑）
  # 中英切换仍用 Shift_L（commit_code），两套机制互不冲突
  ascii_composer/good_old_caps_lock: true
  ascii_composer/switch_key/Caps_Lock: commit_code

  schema_list:
    - schema: wubi_pinyin       # 五笔拼音混输（默认，五笔优先+全拼兜底）
    - schema: wubi86            # 五笔86码表载体（编译用，勿删）
    - schema: rime_ice          # 雾凇拼音（全拼）
    - schema: t9                # 中文九键
    - schema: double_pinyin     # 自然码双拼
    - schema: double_pinyin_abc # 智能 ABC 双拼
    - schema: double_pinyin_mspy # 微软双拼
    - schema: double_pinyin_sogou # 搜狗双拼
    - schema: double_pinyin_flypy # 小鹤双拼
    - schema: double_pinyin_ziguang # 紫光双拼
    - schema: double_pinyin_jiajia # 拼音加加双拼
